[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyproject-doctor"
version = "1.0.0"
description = "Production PEP 517/518/621 validator, packaging linter, and schema inspector."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "pyproject",
    "pep621",
    "pep517",
    "pep518",
    "packaging",
    "linter",
    "validator",
    "cli",
    "developer-tools"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
pyproject-doctor = "pyproject_doctor.cli:main"
pypdoc = "pyproject_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/pyproject-doctor"
Repository = "https://github.com/slopggobblercobbler81/pyproject-doctor"
Issues = "https://github.com/slopggobblercobbler81/pyproject-doctor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyproject_doctor*"]
